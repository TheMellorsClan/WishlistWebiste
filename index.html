<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wishlist</title>
    <link rel="stylesheet" href="opendyslexic.css?v=1">
    <link rel="stylesheet" href="styles.css?v=9">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Personal lists</p>
          <h1 id="app-title">Wishlist</h1>
          <div class="list-switch" aria-label="Choose list">
            <button class="active" type="button" data-list="wishlist">Wishlist</button>
            <button type="button" data-list="projects">Projects</button>
          </div>
        </div>
        <div class="summary" aria-label="Wishlist summary">
          <div>
            <span id="stat-count">0</span>
            <small>Items</small>
          </div>
          <div>
            <span id="stat-high">0</span>
            <small>High</small>
          </div>
          <div>
            <span id="stat-purchased">0</span>
            <small>Purchased</small>
          </div>
        </div>
      </header>

      <section class="workspace" aria-label="Wishlist workspace">
        <aside class="panel form-panel">
          <div class="panel-heading">
            <h2 id="form-title">Add item</h2>
            <button class="ghost icon-button" id="clear-form" type="button" title="Clear form" aria-label="Clear form">
              <span aria-hidden="true">x</span>
            </button>
          </div>

          <form id="wish-form" autocomplete="off" novalidate>
            <input id="editing-id" type="hidden">

            <label>
              <span>Item name</span>
              <input id="item-title" name="title" type="text" maxlength="90" placeholder="Noise cancelling headphones">
            </label>

            <label>
              <span>Product link</span>
              <input id="item-url" name="url" type="text" inputmode="url" placeholder="example.com/product">
            </label>

            <div class="form-grid">
              <label>
                <span>Store</span>
                <input id="item-store" name="store" type="text" maxlength="60" placeholder="Store name">
              </label>

              <label>
                <span>Price</span>
                <input id="item-price" name="price" type="text" maxlength="24" placeholder="$149">
              </label>
            </div>

            <div class="form-grid">
              <label>
                <span>Category</span>
                <select id="item-category" name="category">
                  <option>General</option>
                  <option>Home</option>
                  <option>Tech</option>
                  <option>Clothing</option>
                  <option>Books</option>
                  <option>Comics</option>
                  <option>Lego</option>
                  <option>Funko Pops</option>
                  <option>Travel</option>
                  <option>Gifts</option>
                </select>
              </label>

              <label>
                <span>Priority</span>
                <select id="item-priority" name="priority">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </label>
            </div>

            <label>
              <span>Image link</span>
              <input id="item-image" name="image" type="text" inputmode="url" placeholder="example.com/photo.jpg">
            </label>

            <label>
              <span>Product description</span>
              <textarea id="item-notes" name="notes" rows="4" maxlength="500" placeholder="Description, size, color, discount code, or anything else"></textarea>
            </label>

            <div class="form-actions">
              <button class="primary" id="submit-button" type="button">
                <span aria-hidden="true">+</span>
                <span>Add item</span>
              </button>
              <button class="secondary" id="cancel-edit" type="button" hidden>Cancel</button>
            </div>
            <p id="form-feedback" class="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </aside>

        <section class="panel list-panel">
          <div id="project-controls" class="project-controls" hidden>
            <label>
              <span>Project</span>
              <select id="project-select" aria-label="Choose project"></select>
            </label>
            <button class="secondary small" id="new-project" type="button">New project</button>
            <button class="secondary small" id="rename-project" type="button">Rename</button>
          </div>

          <div class="toolbar">
            <label class="search-box">
              <span class="sr-only">Search current list</span>
              <input id="search-input" type="search" placeholder="Search wishlist">
            </label>

            <select id="category-filter" aria-label="Filter by category">
              <option value="all">All categories</option>
            </select>

            <select id="status-filter" aria-label="Filter by status">
              <option value="all">All items</option>
              <option value="active">Still wanted</option>
              <option value="purchased">Purchased</option>
            </select>

            <select id="sort-select" aria-label="Sort wishlist">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="category">Category</option>
              <option value="priority">Priority</option>
              <option value="title">Name</option>
            </select>
          </div>

          <div class="list-topline">
            <h2 id="list-heading">Your wishlist items</h2>
            <div class="data-actions">
              <button class="secondary small" id="export-pdf" type="button">Export PDF</button>
              <button class="secondary small" id="import-code" type="button">Import code</button>
              <label class="secondary small file-action">
                Import JSON
                <input id="import-data" type="file" accept="application/json,.json">
              </label>
            </div>
          </div>

          <div id="wish-list" class="wish-grid" aria-live="polite"></div>

          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-mark" aria-hidden="true"></div>
            <h3>No items found</h3>
            <p>Add a product or adjust the filters.</p>
          </div>
        </section>
      </section>
    </main>

    <div id="restore-modal" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="restore-title">
        <div class="modal-heading">
          <h2 id="restore-title">Import restore code</h2>
          <button class="ghost icon-button" id="restore-close" type="button" title="Close" aria-label="Close">
            <span aria-hidden="true">x</span>
          </button>
        </div>
        <label>
          <span>Restore code</span>
          <textarea id="restore-code-input" rows="8" placeholder="Paste WISHLIST-V1 code"></textarea>
        </label>
        <p id="restore-feedback" class="form-feedback warning" role="status" aria-live="polite"></p>
        <div class="form-actions">
          <button class="primary" id="restore-submit" type="button">Restore wishlist</button>
          <button class="secondary" id="restore-cancel" type="button">Cancel</button>
        </div>
      </section>
    </div>

    <template id="wish-card-template">
      <article class="wish-card">
        <div class="item-media"></div>
        <div class="item-body">
          <div class="item-heading">
            <div>
              <h3></h3>
              <p class="item-store"></p>
            </div>
            <span class="priority-badge"></span>
          </div>
          <p class="item-notes"></p>
          <div class="item-meta"></div>
          <div class="item-actions">
            <a class="link-button">Open</a>
            <button class="secondary small edit-item" type="button">Edit</button>
            <button class="secondary small toggle-item" type="button"></button>
            <button class="danger small delete-item" type="button">Delete</button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js?v=25"></script>
  </body>
</html>
